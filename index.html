<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>3D Graph with Positions and Edges</title>

<style>
body { margin:0; overflow:hidden; }
#graph { width:100vw; height:100vh; }
</style>

<!-- Correct browser-ready builds -->
<script src="https://unpkg.com/three@0.161.0/build/three.min.js"></script>
<script src="https://unpkg.com/3d-force-graph@1.78.0/dist/3d-force-graph.min.js"></script>
</head>

<body>
<div id="graph"></div>

<script>
const Graph = ForceGraph3D()(document.getElementById('graph'));

// Load graph JSON + positions text (make sure these files are in the same folder as index.html)
Promise.all([
  fetch('graph_clean (1).json').then(res => res.json()),
  fetch('backup_positions.txt').then(res => res.text())
])
.then(([graphData, positionsText]) => {

  // Parse positions from TXT
  const positions = {};
  positionsText.split("\n").forEach(line => {
    const [id, x, y, z] = line.trim().split(",");
    positions[id] = { x: +x, y: +y, z: +z };
  });

  // Merge positions into nodes
  const nodes = graphData.nodes.map(n => positions[n.id] ? { ...n, ...positions[n.id] } : n);

  Graph.graphData({ nodes, links: graphData.links });

  // ----------------------------
  // Node rendering
  // ----------------------------
  Graph.nodeThreeObject(() => new THREE.Sprite(
    new THREE.SpriteMaterial({ color: 0xffffff })
  ));
  Graph.nodeRelSize(2);
  Graph.nodeOpacity(0.9);

  // ----------------------------
  // Edge rendering
  // ----------------------------
  Graph.linkWidth(0.5);
  Graph.linkOpacity(0.1);
  Graph.linkColor(() => 'rgba(255,255,255,0.1)');

  // ----------------------------
  // Physics
  // ----------------------------
  Graph.d3Force('charge').strength(-900);
  Graph.d3Force('link').distance(250);
  Graph.d3Force('center', null);
  Graph.d3VelocityDecay(0.35);
  Graph.cooldownTicks(Infinity);

  // Camera back
  Graph.cameraPosition({ z: 12000 });

  // ----------------------------
  // Save positions into JSON
  // ----------------------------
  function savePositionsJSON(filename="graph_with_positions.json") {
    const graphCopy = {
      nodes: Graph.graphData().nodes.map(n => ({ ...n })),
      links: Graph.graphData().links.map(l => ({ ...l }))
    };

    const blob = new Blob([JSON.stringify(graphCopy, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();

    URL.revokeObjectURL(url);
    console.log("Saved graph JSON:", filename);
  }

  // Backup every 5 minutes
  setInterval(() => savePositionsJSON("backup_graph.json"), 300000);

  // Final save after 30 minutes
  setTimeout(() => savePositionsJSON("final_graph.json"), 1800000);

});
</script>
</body>
</html>
